<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한로로 팬사이트 - HANRORO HOUSE (종료)</title>
<meta name="description" content="한로로 팬사이트는 운영을 종료했습니다. 그동안 찾아주셔서 감사했습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE8DC;
    --paper-fold: #E1DAC8;
    --ink: #2A2724;
    --ink-soft: #58524A;
    --berry: #9C4A5C;
    --rule: #C7BFA9;
  }
  *{ box-sizing:border-box; }
  html, body{
    height:100%;
    margin:0;
  }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:480px;
    width:100%;
    text-align:center;
    padding:56px 36px;
    background:var(--paper-fold);
    border:1px solid var(--rule);
    border-radius:6px;
  }
  .logo{
    font-family:'Gowun Batang', serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
  }
  .logo span{
    font-size:12px;
    font-weight:400;
    color:var(--ink-soft);
    margin-left:6px;
    letter-spacing:0.5px;
  }
  .rule{
    width:36px;
    height:2px;
    background:var(--berry);
    margin:22px auto;
    border:none;
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-size:24px;
    line-height:1.5;
    margin:0 0 18px;
  }
  p{
    font-size:14.5px;
    line-height:1.8;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .signoff{
    margin-top:28px;
    font-family:'Gowun Batang', serif;
    font-size:14px;
    color:var(--berry);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">한로로 <span>HANRORO HOUSE</span></div>
    <hr class="rule">
    <h1>이 팬사이트는<br>종료되었습니다</h1>
    <p>그동안 함께해주신 모든 분들께 진심으로 감사드립니다.</p>
    <p>사이트는 더 이상 운영되지 않으며, 이 페이지를 마지막으로 문을 닫습니다.</p>
    <div class="signoff">— 한로로 팬사이트 운영자 드림 —</div>
  </div>
</body>
</html>
