    --berry: #9C4A5C;
    --rule: #C7BFA9;
    --rule-strong: #ABA189;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
  }
  header{
    max-width:1080px;
    margin:0 auto;

    font-size:20px;

  nav{
    max-width:1080px;
    margin:0 auto;
    padding:0 24px 14px;
    display:flex;
    flex-wrap:wrap;

  }
  nav a{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:14px;
    padding:6px 0;
    border-bottom:2px solid transparent;
  }
  nav a.active, nav a:hover{ color:var(--berry); border-bottom-color:var(--berry); }
  main{
    max-width:820px;
    margin:0 auto;
    padding:80px 24px 100px;

  }
  .eyebrow{
    font-family:'Gowun Batang', serif;
    color:var(--berry);
    font-size:15px;
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-size:36px;
    margin:14px 0 22px;
  }
  p.desc{
    font-size:15.5px;
    line-height:1.8;
    color:var(--ink-soft);
    margin:0 auto 34px;
    max-width:600px;
  }
  .cta{
    display:inline-block;
    background:var(--berry);
    color:#fff;
    text-decoration:none;
    font-size:15px;
    font-weight:700;
    padding:14px 32px;
    border-radius:4px;
    transition:opacity 0.15s ease;
  }
  .cta:hover{ opacity:0.88; }
  footer{
    text-align:center;
    padding:24px;
    font-size:12.5px;
    color:var(--ink-soft);
    opacity:0.7;
